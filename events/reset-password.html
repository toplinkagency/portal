
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Recuperar senha | TLA Events</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080f1d;
      color: #f4f6fb;
      font-family: system-ui, sans-serif;
      padding: 20px;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 30px;
      background: #111d30;
      border: 1px solid #30405b;
      border-radius: 16px;
    }
    h1 { font-size: 24px; }
    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #394960;
      background: #0b1424;
      color: white;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #d0ae67;
      color: #101827;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    p { line-height: 1.6; color: #aab8ce; }
    a { color: #efc66c; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Recuperar palavra-passe</h1>
    <p>TLA Events — Administração</p>

    <p id="status">A verificar o link de recuperação...</p>

    <form id="reset-form" hidden>
      <label for="password">Nova palavra-passe</label>
      <input id="password"
             type="password"
             autocomplete="new-password"
             minlength="12" required>

      <label for="confirm">Confirmar palavra-passe</label>
      <input id="confirm"
             type="password"
             autocomplete="new-password"
             minlength="12" required>

      <button id="submit" type="submit">
        Guardar nova palavra-passe
      </button>
    </form>

    <p id="login-link" hidden>
      <a href="./admin.html">
        Voltar ao painel administrativo
      </a>
    </p>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://zuhozwndujsnnxkrcopk.supabase.co";

    const SUPABASE_KEY =
      "hcJ+e_KT4PN,Xr-";

    const recoveryLink =
      new URLSearchParams(
        location.hash.slice(1)
      ).get("type") === "recovery";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const $ = id => document.getElementById(id);
    let authorized = false;

    function enableRecovery() {
      authorized = true;
      $("reset-form").hidden = false;
      $("status").textContent =
        "Escolha uma nova palavra-passe com pelo menos 12 caracteres.";

      // Remover tokens da barra de endereços.
      history.replaceState(
        null, "",
        location.pathname
      );
    }

    supabase.auth.onAuthStateChange(
      (event, session) => {
        if (
          event === "PASSWORD_RECOVERY" &&
          session
        ) {
          enableRecovery();
        }
      }
    );

    async function initialize() {
      const { data, error } =
        await supabase.auth.getSession();

      if (
        recoveryLink &&
        !error &&
        data.session
      ) {
        enableRecovery();
      } else if (!authorized) {
        $("status").textContent =
          "Link inválido ou expirado. Solicite um novo email de recuperação.";
      }
    }

    $("reset-form").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        if (!authorized) return;

        const password = $("password").value;

        if (password !== $("confirm").value) {
          $("status").textContent =
            "As palavras-passe não coincidem.";
          return;
        }

        if (password.length < 12) {
          $("status").textContent =
            "Utilize pelo menos 12 caracteres.";
          return;
        }

        $("submit").disabled = true;

        const { error } =
          await supabase.auth.updateUser({
            password
          });

        if (error) {
          $("status").textContent = error.message;
          $("submit").disabled = false;
          return;
        }

        $("reset-form").hidden = true;
        $("status").textContent =
          "Palavra-passe atualizada com sucesso!";

        $("login-link").hidden = false;

        await supabase.auth.signOut();
      }
    );

    initialize();
  </script>
</body>
</html>
